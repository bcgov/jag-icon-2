name: Push to Prod 
permissions:
  contents: write
  security-events: write
  
on:
  workflow_dispatch:
    inputs:
      application:
        required: true
        description: What application do you want to push to prod?
        type: choice
        options:
          - jag-icon2-auth
          - jag-icon2-biometric
          - jag-icon2-common
          - jag-icon2-hsr
          - jag-icon2-myfiles

env:
  IMAGE_NAME: ${{ github.event.inputs.application }}
  REPO_KEY: iaf9
  BRANCH_NAME: main
  VALUES_FILE: prod

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set Conditions
        run: |
          if [[ "${{ env.IMAGE_NAME }}" == "jag-icon2-auth" ]]; then
            echo "IMAGE_PREFIX=auth" >> $GITHUB_ENV
          elif [[ "${{ env.IMAGE_NAME }}" == "jag-icon2-biometric" ]]; then
            echo "IMAGE_PREFIX=bio" >> $GITHUB_ENV
          elif [[ "${{ env.IMAGE_NAME }}" == "jag-icon2-common" ]]; then
            echo "IMAGE_PREFIX=common" >> $GITHUB_ENV
          elif [[ "${{ env.IMAGE_NAME }}" == "jag-icon2-hsr" ]]; then
            echo "IMAGE_PREFIX=hsr" >> $GITHUB_ENV
          elif [[ "${{ env.IMAGE_NAME }}" == "jag-icon2-myfiles" ]]; then
            echo "IMAGE_PREFIX=myfiles" >> $GITHUB_ENV
          else
            echo "Unknown application: ${{ env.IMAGE_NAME }}"
          fi

      - name: Login to Artifactory
        uses: docker/login-action@v1
        with:
          registry: artifacts.developer.gov.bc.ca
          username: ${{ secrets.ARTIFACTORY_USERNAME }}
          password: ${{ secrets.ARTIFACTORY_PASSWORD }}
      
      # Get SHORT_SHA for the version
      - name: Get short SHA
        id: short_sha
        run: |
          echo "::set-output name=SHORT_SHA::$(git rev-parse --short HEAD)"
          echo "Short SHA: $SHORT_SHA"

      #- name: Backup Prod Image
      #  run: |
      #    docker pull artifacts.developer.gov.bc.ca/${{env.REPO_KEY}}-jag-icon2/${{env.IMAGE_NAME}}:prod
      #    docker tag artifacts.developer.gov.bc.ca/${{env.REPO_KEY}}-jag-icon2/${{env.IMAGE_NAME}}:prod artifacts.developer.gov.bc.ca/${{env.REPO_KEY}}-jag-icon2/${{env.IMAGE_NAME}}:prod-backup
      #    docker push artifacts.developer.gov.bc.ca/${{env.REPO_KEY}}-jag-icon2/${{env.IMAGE_NAME}}:prod-backup
    
      - name: Docker Pull to Artifactory
        run: |
          docker pull artifacts.developer.gov.bc.ca/${{env.REPO_KEY}}-jag-icon2/${{env.IMAGE_NAME}}:test
      
      - name: Docker Tag and Push to Artifactory
        run: |
          docker tag artifacts.developer.gov.bc.ca/${{env.REPO_KEY}}-jag-icon2/${{env.IMAGE_NAME}}:test artifacts.developer.gov.bc.ca/${{env.REPO_KEY}}-jag-icon2/${{env.IMAGE_NAME}}:prod
          docker push artifacts.developer.gov.bc.ca/${{env.REPO_KEY}}-jag-icon2/${{env.IMAGE_NAME}}:prod

      - name: Set GitOps SSH Key
        uses: webfactory/ssh-agent@v0.5.4
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}
      
      - name: Update Helm Prod Values and Commit
        id: helm
        run: |

          echo "Updating ${{ env.BRANCH_NAME }} helm  values to trigger ArgoCD deployment "
            
          # Commit and push the changes
          git config --global user.email "actions@github.com"
          git config --global user.name "JAG-ICON2 GitHub Actions"
          git clone -b ${{ env.BRANCH_NAME }} --single-branch git@github.com:bcgov-c/tenant-gitops-af9914.git
            
          # Navigate to the directory containing your Helm values file for the environment develop -> DEV, test -> test
          
          cd tenant-gitops-af9914/charts
            
          # Update the Helm values file with the new image tag and version
          DATETIME=$(date +'%Y-%m-%d %H:%M:%S')  # Get current date and time
          echo "Updating tag ${{ env.IMAGE_PREFIX }}version: to ${{ steps.short_sha.outputs.SHORT_SHA }}"
  
          sed -i "s/${{ env.IMAGE_PREFIX }}version: .*/${{ env.IMAGE_PREFIX }}version: ${{ steps.short_sha.outputs.SHORT_SHA }} # Image Updated on $DATETIME/" ../deploy/${{ env.VALUES_FILE }}_values.yaml

          git add .
            
          git add ../deploy/${{ env.VALUES_FILE }}_values.yaml
            
          # Repackage Helm Chart      
  
          cd gitops
  
          helm dependency build
  
          git add .
            
          git commit -m "Update ${{ env.BRANCH_NAME }} image tag"

          # pull any changes
          git pull origin ${{ env.BRANCH_NAME }}
          git push origin ${{ env.BRANCH_NAME }}  # Update the branch name as needed
